<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 플레이리스트</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; }
        .upload-container { margin-bottom: 20px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        input[type="text"] { width: 70%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        button { padding: 10px 15px; background: #1db954; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1aa34a; }
        .playlist { margin-top: 20px; }
        .song-item { padding: 10px; background: #1e1e1e; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .song-item button { background: #333; }
        .song-item button:hover { background: #e74c3c; }
    </style>
</head>
<body>

    <!-- 새 음악(유튜브 링크) 추가하기 -->
    <div class="upload-container">
        <h3>새 음악 추가하기 (유튜브 링크)</h3>
        <input type="text" id="youtubeUrl" placeholder="유튜브 영상 주소(URL)를 입력하세요">
        <button onclick="addYouTubeSong()">플레이리스트 추가</button>
    </div>

    <!-- 재생목록 표시 영역 -->
    <div class="playlist">
        <h3>재생목록</h3>
        <div id="songList"></div>
    </div>

    <!-- 유튜브 API 플레이어 (화면 안 보이게 숨김) -->
    <div id="youtube-player" style="display:none;"></div>

    <!-- 파이어베이스 SDK (v8 기준 예시) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- 유튜브 IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script src="script.js"></script>
</body>
</html>
